[project]
name = "excel-engine-bench"
version = "0.1.0"
description = "Reproducible benchmark of Excel engines: OpenPyXL vs Pandas+calamine vs Polars vs DuckDB."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1",
  "pandas>=2.2",
  "python-calamine>=0.2",
  "polars>=1.0",
  "fastexcel>=0.10",
  "duckdb>=1.0",
  "psutil>=6.0",
  "xlsxwriter>=3.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
